{{- if .Values.serviceAccount.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "my-service.serviceAccountName" . }}-buildkit-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-service.labels" . | nindent 4 }}
rules:
  # ConfigMaps — used to pass Dockerfiles to BuildKit jobs
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "delete"]
  # Jobs — BuildKit build jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # jobs/status is a subresource and must be listed separately
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get", "watch"]
  # Pods — needed to stream BuildKit job logs
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "my-service.serviceAccountName" . }}-buildkit-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-service.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "my-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "my-service.serviceAccountName" . }}-buildkit-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
