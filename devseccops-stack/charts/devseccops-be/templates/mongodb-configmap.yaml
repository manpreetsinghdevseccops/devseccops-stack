{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-service.labels" . | nindent 4 }}
    component: mongodb
data:
  mongodb.conf: |
    storage:
      dbPath: /data/db
    # Authentication disabled for development environment
    # security:
    #   authorization: enabled
    {{- if gt (int .Values.mongodb.replicaCount) 1 }}
    replication:
      replSetName: "rs0"
    {{- end }}

  init-mongo.sh: |
    #!/bin/bash
    set -e
    echo "MongoDB Init: Starting initialization..."
    mongod --dbpath /data/db --bind_ip_all --port 27017 --fork --logpath /tmp/mongodb-init.log
    echo "MongoDB Init: Waiting for MongoDB to be ready..."
    until mongosh --host localhost --eval "db.adminCommand('ping')" &>/dev/null; do
      sleep 2
    done
    echo "MongoDB Init: Creating/Updating admin user..."
    mongosh --host localhost --eval "
      use admin;
      try {
        db.createUser({
          user: '{{ .Values.mongodb.auth.username }}',
          pwd: '{{ .Values.mongodb.auth.password }}',
          roles: [ { role: 'root', db: 'admin' } ]
        });
        print('✅ MongoDB Init: Admin user created successfully');
      } catch (e) {
        if (e.codeName === 'DuplicateKey') {
          print('✅ MongoDB Init: Admin user already exists');
        } else {
          print('❌ Error: ' + e.message);
          throw e;
        }
      }
    "
    echo "MongoDB Init: Shutting down temporary instance..."
    mongosh --host localhost --eval "db.getSiblingDB('admin').shutdownServer()" || true
    sleep 3
    echo "✅ MongoDB Init: Initialization complete"
{{- end }}
