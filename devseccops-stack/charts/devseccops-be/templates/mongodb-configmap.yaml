{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-service.labels" . | nindent 4 }}
    component: mongodb
data:
  mongodb.conf: |
    storage:
      dbPath: /data/db
    {{- if gt (int .Values.mongodb.replicaCount) 1 }}
    replication:
      replSetName: "rs0"
    {{- end }}
{{- end }}
