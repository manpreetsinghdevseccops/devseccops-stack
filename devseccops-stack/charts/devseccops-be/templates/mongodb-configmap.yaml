{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "my-service.labels" . | nindent 4 }}
    component: mongodb
data:
  mongodb.conf: |
    storage:
      dbPath: /data/db
    security:
      authorization: enabled
    {{- if gt (int .Values.mongodb.replicaCount) 1 }}
    replication:
      replSetName: "rs0"
    {{- end }}

  init-mongo.sh: |
    #!/bin/bash
    set -e
    echo "MongoDB Init: Starting initialization..."
    mongod --dbpath /data/db --bind_ip_all --port 27017 --fork --logpath /tmp/mongodb-init.log
    echo "MongoDB Init: Waiting for MongoDB to be ready..."
    until mongosh --host localhost --eval "db.adminCommand('ping')" &>/dev/null; do
      sleep 2
    done
    echo "MongoDB Init: Checking if admin user exists..."
    USER_EXISTS=$(mongosh --host localhost --quiet --eval "use admin; var user = db.getUser('{{ .Values.mongodb.auth.username }}'); if (user) { print('exists'); } else { print('not_exists'); }" 2>/dev/null || echo "not_exists")
    if [ "$USER_EXISTS" = "not_exists" ]; then
      echo "MongoDB Init: Creating admin user..."
      mongosh --host localhost --eval "use admin; db.createUser({ user: '{{ .Values.mongodb.auth.username }}', pwd: '{{ .Values.mongodb.auth.password }}', roles: [ { role: 'root', db: 'admin' } ] });"
      echo "✅ MongoDB Init: Admin user created successfully"
    else
      echo "✅ MongoDB Init: Admin user already exists"
    fi
    echo "MongoDB Init: Shutting down temporary instance..."
    mongosh --host localhost --eval "db.getSiblingDB('admin').shutdownServer()" || true
    sleep 3
    echo "✅ MongoDB Init: Initialization complete"
{{- end }}
